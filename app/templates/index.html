{% extends "base.html" %}
{% block title %}Create Your Comic{% endblock %}
{% block content %}
<div class="card-container">
    <div class="form-card">
        <h2>✏️ Create Your Comic</h2>
        <form action="/generate" method="post" id="comicForm">
            <div class="form-group"><label>Story Prompt:</label><textarea name="prompt" required placeholder="A brave fox exploring an enchanted forest."></textarea></div>
            <div class="form-group"><label>Character Name:</label><input type="text" name="character_name" value="Free" required></div>
            <div class="form-group"><label>Setting:</label>
                <select name="setting">
                    <option value="Forest">Forest</option>
                    <option value="School">School</option>
                    <option value="Space">Space</option>
                    <option value="City">City</option>
                </select>
            </div>
            <div class="form-group"><label>Story Tone:</label>
                <select name="tone">
                    <option value="Dramatic">Dramatic</option>
                    <option value="Funny">Funny</option>
                    <option value="Light-hearted">Light-hearted</option>
                    <option value="Poetic">Poetic</option>
                </select>
            </div>
            <div class="form-group"><label>Art Style:</label>
                <select name="style">
                    <option value="Realistic">Realistic</option>
                    <option value="Comic Book">Comic Book</option>
                    <option value="Anime">Anime</option>
                    <option value="Pixel Art">Pixel Art</option>
                </select>
            </div>
            <button type="submit" id="generateBtn" class="btn primary-btn">Generate Comic</button>
        </form>
    </div>
</div>
{% endblock %}
